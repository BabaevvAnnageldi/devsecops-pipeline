# Dependabot keeps every pin in this repo fresh by opening PRs, which must pass
# the same security gates as any other change before they can merge.
#
# - github-actions: bumps the commit SHAs of pinned actions (and the "# vX.Y.Z" comment)
# - docker:         bumps the python:3.12-slim base image digest
# - pip:            bumps exact versions in app/requirements.txt
# - terraform:      bumps the AWS provider constraint and .terraform.lock.hcl
#
# cooldown: wait a few days after a release before proposing it, so a hijacked
# release (like Trivy 0.69.4 in March 2026) is likely caught before we adopt it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"

  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "terraform"
